spring.application.name=SerbianElection2026
management.endpoints.web.exposure.include=health

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/serbian_elections}
spring.datasource.username=${DATABASE_USERNAME:serbian_elections}
spring.datasource.password=${DATABASE_PASSWORD:serbian_elections}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

rik.base-url=${RIK_BASE_URL:https://www.rik.parlament.gov.rs}
rik.election-round-id=680072
rik.electoral-list-document-type=2
rik.import-interval-ms=900000
rik.electoral-list-submission-deadline=2026-10-04
