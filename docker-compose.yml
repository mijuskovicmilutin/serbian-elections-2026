services:
  postgres:
    image: postgres:16
    container_name: serbian-elections-postgres
    environment:
      POSTGRES_DB: serbian_elections
      POSTGRES_USER: serbian_elections
      POSTGRES_PASSWORD: serbian_elections
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serbian_elections"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
